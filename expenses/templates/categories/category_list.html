
{% extends 'base.html' %}

{% block title %}{{ page_title }} | Expense Tracker{% endblock %}

{% block content %}
<div class="form-card mx-auto">
    <h2 class="mb-4">{{ page_title }}</h2>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="btn btn-primary">
            Save Category
        </button>

        <a href="{% url 'category_list' %}"
           class="btn btn-outline-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
