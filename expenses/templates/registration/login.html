<!DOCTYPE html>
<html>
<head>
    <title>Login - Expense Tracker</title>
</head>
<body>

    <h1>Login</h1>

    <form method="post">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">Login</button>
    </form>

    <p>
        Don't have an account?
        <a href="{% url 'register' %}">Create Account</a>
    </p>

</body>
</html>
